<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&subset=cyrillic&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>Сравнение поиска: Hackathonai Store</title>
</head>
<body>
<header id="app-header" class="site-header"></header>
<main>
  <div class="container">
    <div class="page-head">
      <h1>Обычный и умный поиск рядом</h1>
      <p>Введите один запрос, и мы покажем, что найдёт каждый режим. Товары, которые обычный поиск пропустил, помечены.</p>
      <form id="compare-form" class="search compare-form" role="search" autocomplete="off">
        <div class="search-field">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Например: кибер бэкап" aria-label="Запрос для сравнения">
        </div>
        <button class="btn btn-primary" type="submit">Сравнить</button>
      </form>
      <div class="chips" id="chips" aria-label="Примеры запросов"></div>
    </div>

    <div id="verdict" class="verdict" hidden></div>
    <div class="columns" id="columns" hidden>
      <section class="column" aria-labelledby="h-base">
        <div class="column-head"><h2 id="h-base">Обычный поиск</h2><span class="meta" id="meta-base"></span></div>
        <div class="grid grid-1" id="res-base"></div>
      </section>
      <section class="column smart" aria-labelledby="h-smart">
        <div class="column-head"><h2 id="h-smart">Умный поиск</h2><span class="meta" id="meta-smart"></span></div>
        <div id="note-smart" class="notice" hidden></div>
        <div class="grid grid-1" id="res-smart"></div>
      </section>
    </div>
    <div style="height:64px"></div>
  </div>
</main>
<footer id="app-footer" class="footer"></footer>
<script src="js/config.js"></script>
<script src="js/mock.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/compare.js"></script>
</body>
</html>
